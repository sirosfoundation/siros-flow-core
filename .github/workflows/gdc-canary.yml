name: gdc canary

# The standing live probe of the deployed gdc flow service (the
# evidence discipline of the design doc's §13): the live round trip —
# start → a PID issued by the deployment's own embedded issuer →
# present → gdc's REAL go-trust decides → EHIC issue/redeem/verify.
#
# What it catches that the local suites structurally cannot: a PDP
# config or trust-list change, a rotated or mangled key/secret, a
# broken discovery path, deploy drift between the pinned image and
# the deployed digest — trust-chain regressions that stay green
# locally while production trust breaks. The three live-forced
# issuer-core fixes (the SD-JWT VC discovery endpoint, the
# entity-keyed AuthZEN subject, x5c in issued SD-JWTs) are the proof
# the canary exists: the local PDP doubles never saw them.
#
# It is an EXTERNAL observer on purpose: it fails even when the
# deployment claims to be healthy, needs no credentials on the
# cluster beyond the public URL, and its red/green is visible next to
# the code whose changes caused it.

on:
  schedule:
    # Every 6 hours (UTC).
    - cron: '0 */6 * * *'
  # Manual runs when debugging a red canary.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gdc-canary
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  live-gdc-round-trip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Materialize the deployment's integrator key
        env:
          GDC_ISSUER_KEY_PEM: ${{ secrets.GDC_ISSUER_KEY_PEM }}
        run: |
          if [ -z "$GDC_ISSUER_KEY_PEM" ]; then
            echo "::error::the GDC_ISSUER_KEY_PEM secret is not set (the gdc deployment's flow-issuer signing key — fixtures/rendered/fly-gdc/vc-pki/flow_issuer_ec_private.pem in sirosid-dev)"
            exit 1
          fi
          printf '%s' "$GDC_ISSUER_KEY_PEM" > "$RUNNER_TEMP/flow-issuer-signing.pem"
      - name: The live gdc round trip
        env:
          # The deployment's rendered integrator key (one deployment,
          # one key: the embedded issuer's own signing key).
          LIVE_GDC_INTEGRATOR_KEY: ${{ runner.temp }}/flow-issuer-signing.pem
        run: >
          cargo test --locked -p siros-flow-service --test live_gdc --
          --ignored --nocapture
