# SonarCloud project configuration.
#
# cpd.exclusions (copy-paste detection): the integration-test files are
# EXCLUDED from duplication analysis by design — each e2e binary
# constructs a near-identical AppState literal (the embedded issuer's
# wiring is the same shape in every test by construction; the pin PR's
# three new posture fields appear in three files and the duplication
# gate fired on the mechanically repeated 3-line groups). Analysis
# (bugs, smells, coverage) still covers them; only the copy-paste
# detector skips.
sonar.cpd.exclusions=crates/siros-flow-service/tests/**
