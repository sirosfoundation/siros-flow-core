# The ehic flow's PLAIN-mode twin (§6.1/§6.2): the same journey, the
# response arriving in OID4VP's unencrypted `direct_post` mode — the
# wallet's `vp_token` + `state` form rides TLS to the response_uri with
# NO JWE layer. THE TRADEOFF IS STATED HERE, VISIBLY: the presentation
# is confidential to the TLS channel and the verifier alone (in the
# encrypted twin, the response is a JWE no intermediary can read).
#
# Why it ships: the wallet pair deployed on gdc completes the plain
# mode TODAY (its engine posts the clear form; the encrypted mode
# waits on its frontend's response-encryption branch), so this is the
# drill's vehicle — the real wallet drives it end-to-end. When the
# wallet pair answers the encrypted modes, the .jwt flow is the
# vehicle and this one remains the compat/ demonstrator of the mode
# the vc verifier stack itself runs.

flow: ehic-pid-presentation-plain
language_version: 1
description: >
  The PID to EHIC journey over OID4VP's plain direct_post mode: the
  presentation form rides TLS unencrypted (the visible tradeoff).

steps:
  - presentation:
      id: present-pid
      response_mode: direct_post
      request:
        - id: pid
          format: dc+sd-jwt
          # vct_values matches ANY listed type (DCQL §5.2) — the
          # registry's PID generations, so a wallet holding any of
          # the deployed PID types satisfies the query.
          meta:
            vct_values:
              ["urn:eudi:pid:arf-1.8:1", "urn:eudi:pid:arf-1.5:1", "urn:eudi:pid:1"]
          # The claims the EHIC subject derives from: the arf-1.8
          # spelling (birthdate) — the registry's live PID shape.
          claims:
            - { path: [given_name] }
            - { path: [family_name] }
            - { path: [birthdate] }
      require: [pid]

  - issuance:
      id: issue-ehic
      credential: "urn:eudi:ehic:1"
      # The identity base is the PID's verified claims (issuing_country,
      # issuing_authority, date_of_expiry — the arf PID and the DC4EU
      # EHIC schemas share them); the EHIC-specific coverage fields
      # (PAN, document number, validity window, authentic source) come
      # from the flow INPUT `coverage` — the integrator's own record.
      # The catalog's claim building filters to the EHIC schema's paths
      # either way: extra PID keys never leak into the EHIC.
      subject:
        from: { step: present-pid, credential: pid, path: [] }
        merge:
          personal_administrative_number: { input: coverage, path: [pan] }
          document_number: { input: coverage, path: [document_number] }
          starting_date: { input: coverage, path: [starting_date] }
          ending_date: { input: coverage, path: [ending_date] }
          date_of_issuance: { input: coverage, path: [date_of_issuance] }
          authentic_source: { input: coverage, path: [authentic_source] }

  - notify:
      # §6.6: the typed event for the flow's audiences — the embedding
      # frontend's SSE stream (the WMP carrier at P-bw4 delivers it to
      # instances). Kinds and definition-authored text only: context
      # values never ride events (§10.1/§10.2).
      id: tell-issued
      event: credential-issued
      message: "The EHIC offer is ready to redeem in your wallet."