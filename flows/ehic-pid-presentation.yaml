# EHIC issuance bound to a PID presentation (design §8.5, the early
# simple flow): present a PID, issue the EHIC with the subject derived
# from the PID's verified claims.
#
# This is the shape siros-issuer-core hard-codes as Mode B today
# (§7.3: present → verified claims become the session subject → issue)
# — expressed here as a definition. The migration question (§14 Q12):
# issuer-core's hard-coded Mode B and §6.5 binding are transitional;
# once flow-core deployments front them, the hard-coded paths retire
# behind their own config gates.

flow: ehic-pid-presentation
language_version: 1
description: >
  Present a PID; issue the European Health Insurance Card with the
  subject derived from the PID's verified claims. No bind step: the
  presentation IS the subject source (Mode B semantics), and the
  presented credential's trust is the PDP's call at the engine
  boundary, not a step.

steps:
  - presentation:
      id: present-pid
      request:
        - id: pid
          format: dc+sd-jwt
          # vct_values matches ANY listed type (DCQL §5.2) — the
          # registry's PID generations, so a wallet holding any of the
          # deployed PID types satisfies the query.
          meta: { vct_values: ["urn:eudi:pid:arf-1.8:1", "urn:eudi:pid:arf-1.5:1", "urn:eudi:pid:1"] }
          # The claims the EHIC subject derives from: the arf-1.8
          # spelling (birthdate) — the registry's live PID shape.
          claims:
            - { path: [given_name] }
            - { path: [family_name] }
            - { path: [birthdate] }
      require: [pid]

  - issuance:
      id: issue-ehic
      credential: "urn:eudi:ehic:1"
      # The identity base is the PID's verified claims (issuing_country,
      # issuing_authority, date_of_expiry — the arf PID and the DC4EU
      # EHIC schemas share them); the EHIC-specific coverage fields
      # (PAN, document number, validity window, authentic source) come
      # from the flow INPUT `coverage` — the integrator's own record.
      # The catalog's claim building filters to the EHIC schema's paths
      # either way: extra PID keys never leak into the EHIC.
      subject:
        from: { step: present-pid, credential: pid, path: [] }
        merge:
          personal_administrative_number: { input: coverage, path: [pan] }
          document_number: { input: coverage, path: [document_number] }
          starting_date: { input: coverage, path: [starting_date] }
          ending_date: { input: coverage, path: [ending_date] }
          date_of_issuance: { input: coverage, path: [date_of_issuance] }
          authentic_source: { input: coverage, path: [authentic_source] }

  # §6.6: the typed event for the flow's audiences — the embedding
  # frontend's SSE stream (and, at P-bw4, the WMP carrier's instance
  # notification). Kinds and definition-authored text only: context
  # values never ride events (§10.1/§10.2).
  - notify:
      id: tell-issued
      event: credential-issued
      message: "The EHIC offer is ready to redeem in your wallet."
